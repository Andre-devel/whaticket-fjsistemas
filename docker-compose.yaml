version: '3'

networks:
  whaticket:

services:

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME:-whaticket}
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PROXY_PORT=${PROXY_PORT:-443}
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-wwebjs}
      - NODE_ENV=production
    ports:
      - "8040:3000"
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/.wwebjs_auth/:/usr/src/app/.wwebjs_auth/
      - ./backend/.zapo_auth/:/usr/src/app/.zapo_auth/
    networks:
      - whaticket
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      - URL_BACKEND=backend:3000
      - REACT_APP_BACKEND_URL=${BACKEND_URL}/
      - FRONTEND_SERVER_NAME=${FRONTEND_SERVER_NAME}
      - BACKEND_SERVER_NAME=${BACKEND_SERVER_NAME}
    ports:
      - "3000:80"
    networks:
      - whaticket
    depends_on:
      - backend
    restart: unless-stopped
